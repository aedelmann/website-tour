[build]
  publish = "public"
  command = "hugo --gc --minify --cleanDestinationDir --verbose"

[build.environment]
  HUGO_VERSION = "0.121.2"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"
  NODE_VERSION = "18"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."tesla-charging-sync"]
  schedule = "0 */6 * * *"

# Bundled static snapshot so empty/misconfigured Blobs never 500 the public API
[functions."charging-stats"]
  included_files = ["static/data/charging-stats.json"]

[[redirects]]
  from = "/post/*"
  to = "/posts/:splat"
  status = 301

[[redirects]]
  from = "/map"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/map/*"
  to = "/"
  status = 301
  force = true

# Public Charge Stats — live function (Blobs), not frozen static rewrite
[[redirects]]
  from = "/api/charging-stats"
  to = "/.netlify/functions/charging-stats"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Tesla Fleet API app public key — must be HTTP 200 (no redirect), text/plain
[[headers]]
  for = "/.well-known/appspecific/com.tesla.3p.public-key.pem"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Content-Type-Options = "nosniff"
